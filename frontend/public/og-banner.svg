    <text x="0" y="45" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="28" fill="#818cf8">
      Neural Speech Synthesis &amp; Multi-Speaker Studio v2.0
    </text>
    <text x="0" y="95" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="20" fill="#94a3b8">
      30 Neural Personas • 10 Emotion Styles • 24kHz Lossless PCM / MP3 Master Audio
    </text>
  </g>
</svg>
