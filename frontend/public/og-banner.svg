<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="ogBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="ogBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Geometric Grid Background -->
  <g opacity="0.1" stroke="#818cf8" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Large Central Logo Mark -->
  <g transform="translate(100, 160)">
    <rect width="180" height="180" rx="48" fill="#0f172a" stroke="url(#ogBrand)" stroke-width="5" />
    <!-- Waveform & Mic -->
    <g transform="translate(25, 25) scale(0.25)">
      <rect x="130" y="210" width="16" height="92" rx="8" fill="url(#ogBrand)" />
      <rect x="162" y="170" width="16" height="172" rx="8" fill="url(#ogBrand)" />
      <rect x="194" y="130" width="16" height="252" rx="8" fill="url(#ogBrand)" />
      <rect x="232" y="100" width="48" height="160" rx="24" fill="url(#ogBrand)" />
      <path d="M216 200 C 216 280, 296 280, 296 200" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" />
      <line x1="256" y1="280" x2="256" y2="340" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
      <line x1="220" y1="340" x2="292" y2="340" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
      <rect x="302" y="130" width="16" height="252" rx="8" fill="url(#ogBrand)" />
      <rect x="334" y="170" width="16" height="172" rx="8" fill="url(#ogBrand)" />
      <rect x="366" y="210" width="16" height="92" rx="8" fill="url(#ogBrand)" />
    </g>
  </g>

  <!-- Title & Features -->
  <g transform="translate(320, 210)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="56" fill="#ffffff" letter-spacing="2">
