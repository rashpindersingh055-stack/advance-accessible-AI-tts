<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad2)" stroke="url(#primaryGrad2)" stroke-width="6" />
  
  <g filter="url(#glow2)">
    <rect x="130" y="210" width="16" height="92" rx="8" fill="url(#primaryGrad2)" opacity="0.85" />
    <rect x="162" y="170" width="16" height="172" rx="8" fill="url(#primaryGrad2)" opacity="0.9" />
    <rect x="194" y="130" width="16" height="252" rx="8" fill="url(#primaryGrad2)" />
    
    <!-- Central Studio Mic -->
    <rect x="232" y="100" width="48" height="160" rx="24" fill="url(#primaryGrad2)" />
    <path d="M216 200 C 216 280, 296 280, 296 200" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" />
    <line x1="256" y1="280" x2="256" y2="340" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <line x1="220" y1="340" x2="292" y2="340" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    
    <rect x="302" y="130" width="16" height="252" rx="8" fill="url(#primaryGrad2)" />
    <rect x="334" y="170" width="16" height="172" rx="8" fill="url(#primaryGrad2)" opacity="0.9" />
    <rect x="366" y="210" width="16" height="92" rx="8" fill="url(#primaryGrad2)" opacity="0.85" />
  </g>
</svg>
