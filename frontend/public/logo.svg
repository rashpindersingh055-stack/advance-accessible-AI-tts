<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" fill="none">
  <defs>
    <linearGradient id="logoPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(20, 20)">
    <!-- Icon Container -->
    <rect width="140" height="140" rx="36" fill="#090d16" stroke="url(#logoPrimaryGrad)" stroke-width="3" />
    
    <!-- Soundwaves & Mic -->
    <g filter="url(#logoGlow)" transform="translate(10, 5) scale(0.24)">
      <rect x="130" y="210" width="16" height="92" rx="8" fill="url(#logoPrimaryGrad)" opacity="0.85" />
      <rect x="162" y="170" width="16" height="172" rx="8" fill="url(#logoPrimaryGrad)" opacity="0.9" />
      <rect x="194" y="130" width="16" height="252" rx="8" fill="url(#logoPrimaryGrad)" />
      
      <rect x="232" y="100" width="48" height="160" rx="24" fill="url(#logoPrimaryGrad)" />
      <path d="M216 200 C 216 280, 296 280, 296 200" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" />
      <line x1="256" y1="280" x2="256" y2="340" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
      <line x1="220" y1="340" x2="292" y2="340" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
      
      <rect x="302" y="130" width="16" height="252" rx="8" fill="url(#logoPrimaryGrad)" />
      <rect x="334" y="170" width="16" height="172" rx="8" fill="url(#logoPrimaryGrad)" opacity="0.9" />
      <rect x="366" y="210" width="16" height="92" rx="8" fill="url(#logoPrimaryGrad)" opacity="0.85" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(180, 80)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="url(#textGrad)" letter-spacing="2">
      VISION MAX
    </text>
    
    <!-- Studio Tag Badge -->
    <rect x="310" y="-36" width="160" height="34" rx="17" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
    <text x="390" y="-14" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" fill="#818cf8" letter-spacing="3">
      NEURAL 2.0
    </text>

    <!-- Subtitle -->
    <text x="2" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="18" fill="#94a3b8" letter-spacing="1">
      Next-Gen Acoustic Research &amp; Synthetic Voice Studio
    </text>
  </g>
</svg>
