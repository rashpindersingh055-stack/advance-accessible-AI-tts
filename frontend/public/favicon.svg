<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="8" />
  
  <!-- Outer Glow Pulse Ring -->
  <circle cx="256" cy="256" r="180" stroke="url(#glowGrad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Neural Soundwave Crests -->
  <g filter="url(#glow)">
    <!-- Waveform Bars Left to Right -->
    <rect x="130" y="210" width="16" height="92" rx="8" fill="url(#primaryGrad)" opacity="0.8" />
    <rect x="162" y="170" width="16" height="172" rx="8" fill="url(#primaryGrad)" opacity="0.9" />
    <rect x="194" y="130" width="16" height="252" rx="8" fill="url(#primaryGrad)" />
    
    <!-- Central Studio Mic Capsule -->
    <rect x="232" y="100" width="48" height="160" rx="24" fill="url(#primaryGrad)" />
    <path d="M216 200 C 216 280, 296 280, 296 200" stroke="white" stroke-width="14" stroke-linecap="round" fill="none" />
    <line x1="256" y1="280" x2="256" y2="340" stroke="white" stroke-width="14" stroke-linecap="round" />
    <line x1="220" y1="340" x2="292" y2="340" stroke="white" stroke-width="14" stroke-linecap="round" />
    
    <rect x="302" y="130" width="16" height="252" rx="8" fill="url(#primaryGrad)" />
    <rect x="334" y="170" width="16" height="172" rx="8" fill="url(#primaryGrad)" opacity="0.9" />
    <rect x="366" y="210" width="16" height="92" rx="8" fill="url(#primaryGrad)" opacity="0.8" />
  </g>

  <!-- Sparkle Particle Star -->
  <path d="M370 120 Q370 145 395 145 Q370 145 370 170 Q370 145 345 145 Q370 145 370 120 Z" fill="#ec4899" opacity="0.9" />
  <path d="M140 370 Q140 385 155 385 Q140 385 140 400 Q140 385 125 385 Q140 385 140 370 Z" fill="#818cf8" opacity="0.8" />
</svg>
